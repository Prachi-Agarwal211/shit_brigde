<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="sbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#138808" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#030303"/>
  <!-- Glowing Bridge & Arrow Path -->
  <g transform="translate(64, 64)">
    <!-- Bridge Support Base (Subtle) -->
    <path d="M 64,280 L 320,280" stroke="rgba(255,255,255,0.15)" stroke-width="16" stroke-linecap="round" />
    <path d="M 128,280 L 128,320 M 256,280 L 256,320" stroke="rgba(255,255,255,0.1)" stroke-width="12" stroke-linecap="round" />
    
    <!-- Main Bridge Curve / Arrow -->
    <path d="M 40,280 C 40,160 160,80 320,80 L 320,180 L 380,120 L 320,60 L 320,80" fill="none" stroke="url(#sbGrad)" stroke-width="24" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)" />
    
    <!-- Ship Bow / Lower Cargo hull (representing Shipping) -->
    <path d="M 80,240 L 300,240 C 330,240 360,200 360,180" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
    
    <!-- Speed Dots -->
    <circle cx="120" cy="180" r="12" fill="#FF9933" />
    <circle cx="180" cy="180" r="12" fill="#138808" />
    <circle cx="240" cy="180" r="12" fill="#ffffff" />
  </g>
</svg>

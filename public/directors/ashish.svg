<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff87"/>
      <stop offset="100%" stop-color="#00cc6a"/>
    </linearGradient>
    <clipPath id="circle">
      <circle cx="200" cy="160" r="100"/>
    </clipPath>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="24"/>
  <!-- Avatar circle -->
  <circle cx="200" cy="160" r="100" fill="#222" stroke="url(#accent)" stroke-width="2"/>
  <!-- Styilized person silhouette -->
  <circle cx="200" cy="140" r="40" fill="rgba(0,255,135,0.15)"/>
  <ellipse cx="200" cy="260" rx="60" ry="40" fill="rgba(0,255,135,0.1)"/>
  <!-- Initials -->
  <text x="200" y="155" text-anchor="middle" fill="url(#accent)" font-family="serif" font-size="48" font-weight="bold">AJ</text>
  <!-- Name -->
  <text x="200" y="330" text-anchor="middle" fill="white" font-family="serif" font-size="22" font-weight="bold">Ashish Joshi</text>
  <text x="200" y="355" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="11" letter-spacing="3">FOUNDER &amp; CFO</text>
</svg>